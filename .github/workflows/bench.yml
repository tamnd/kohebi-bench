name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. More often than this is not useful on shared runners, where the
    # noise floor is wider than most of the differences we care about.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: "Timed runs per benchmark"
        default: "30"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv pip install --system -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  harness:
    name: Harness tests, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15-dev"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q

  # The harness has to run under the alternative runtimes too, not only measure
  # them. If it cannot import on PyPy, the PyPy column is missing rather than slow.
  portability:
    name: Harness runs under ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # graalpy-25.2, not 25.3. GraalPy tagged 25.3 as graal-25.3.4.1, and
        # setup-python resolves versions through semver, which rejects a four
        # component version outright. 25.2.4 is the newest one it can install.
        runtime: ["pypy3.11", "graalpy-25.2"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.runtime }}
      # Not the dev extra. It pulls mypy, which builds a C extension that does
      # not compile against GraalPy's C API, and this job is about whether the
      # harness runs, not about type checking it a second time.
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests -q

  # Shared runners are noisy, so this job is a smoke test that produces a real
  # report, not a source of publishable numbers. --allow-noisy is set for that
  # reason and should never be set on the machine a headline number comes from.
  measure:
    name: Baseline measurement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install PyPy
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "pypy3.11"
      - name: Install GraalPy
        continue-on-error: true
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "graalpy-25.2"
      - run: python3.14 -m pip install -e .
      - name: Measure
        run: |
          python3.14 -m kohebi_bench benchmarks \
            --runs "${{ inputs.runs || 10 }}" \
            --allow-noisy \
            --out results/ci
      - name: Summarise
        run: cat results/ci/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: results-ci
          path: results/ci
          if-no-files-found: error
          retention-days: 90

  bench-ok:
    name: Benchmarks
    if: always()
    needs: [lint, harness, measure]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required checks passed."
