[project]
name = "kohebi-bench"
version = "0.0.0"
description = "Benchmarks for the kohebi Python runtime against CPython, PyPy, and GraalPy"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "tamnd" }]
keywords = ["python", "benchmark", "performance", "pypy", "graalpy", "kohebi"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Benchmark",
]
# No runtime dependencies on purpose. The harness has to run under CPython,
# PyPy, GraalPy, and eventually kohebi, and every dependency is one more thing
# that can fail to install on one of them and quietly bias the comparison.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.14", "mypy>=1.18"]

[project.urls]
Homepage = "https://github.com/tamnd/kohebi-bench"
Runtime = "https://github.com/tamnd/kohebi"
Compatibility = "https://github.com/tamnd/kohebi-compat"

[project.scripts]
kohebi-bench = "kohebi_bench.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kohebi_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# benchmarks/ is measured code. Reformatting it changes what is being measured.
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.11"
# Pinned so that a check passing locally passes in CI. Without this, mypy
# follows the host platform and platform-specific code type checks
# differently on macOS and on Linux.
platform = "linux"
strict = true
files = ["src"]
